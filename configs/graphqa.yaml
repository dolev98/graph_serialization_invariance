name: graphqa
datasets:
  graphqa:
    n_graphs: 100
    seed: 0
    generators: [er, ba, sfn, sbm, star, path, complete]   # Fatemi A.4, sampled 500:500:500:500:100:100:100
    # Fatemi A.2's seven tasks
    tasks: [edge_existence, node_degree, node_count, edge_count, connected_nodes, disconnected_nodes, cycle_check]
    # canonical = GraphQA "adjacency" encoder: edge list in words, integer labels, sorted (u, v)
    variants:
      relabel: {seeds: 3}                        # relabel-then-sort (Herbst); sort: false for the positional ablation
      order: {kinds: [s_sorted_t_shuffled, t_sorted_s_shuffled, shuffle_all], seeds: 1}
      structure: {toggle: true, replicated: true}   # toggle -> the "incident" adjacency-list encoder
      syntax: {kinds: [plain, json, networkx_code]} # the transcription ladder: prose -> json -> networkx code
# Three modes; the two code modes are crossed with the library arms below, so one variant
# costs 1 + 2 + 2 = 5 calls. One-shot (worked-example) modes were removed: the fixed
# template in the code prompt now does what the exemplar did, and does it in both arms.
modes: [direct, code, graph_as_code]
libraries: [networkx, native]
# Optional: restrict an arm to a subset of tasks, e.g.
# library_tasks: {native: [node_degree, edge_count, node_count, cycle_check]}
models: [hf-qwen3-8b-nscale, hf-deepseek-v3.1-novita, hf-gemma-4-31b, hf-deepseek-v4-flash]
exec: {timeout: 20, mem_mb: 1024, workers: 4}
